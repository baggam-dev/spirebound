<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spirebound · 안전한 주소로 이동</title><link rel="stylesheet" href="styles/pixel-theme.css"><style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#09151b;color:#e2dfc9}main{width:min(520px,100%);padding:24px;box-sizing:border-box;text-align:center}h1{font-size:24px;color:#f0d69b}p{font-size:14px;line-height:1.8}button,a{display:block;margin:14px auto;padding:12px;background:#283b32;color:#f0d69b;font-size:16px}input{max-width:100%}a{text-decoration:none;border:1px solid #bba46c}small{display:block;font-size:11px;line-height:1.8}#status{overflow-wrap:anywhere}</style></head><body><main><small>SPIREBOUND</small><h1 id="heading">안전한 주소로 이동</h1><p id="intro">HTTPS 주소로 바뀌었습니다.<br>이 브라우저의 도전과 개인 기록을 옮겨 주세요.<br>이전 기록은 삭제하지 않습니다.</p><button id="transfer">기록을 옮기고 시작</button><a id="play" href="/">게임으로 이동</a><button id="download">이전 기록 백업 받기</button><label id="importLabel">백업 파일 불러오기 <input id="importFile" type="file" accept="application/json,.json"></label><p id="status" role="status" aria-live="polite"></p><small>새 주소에 이미 있는 기록은 덮어쓰지 않습니다.<br>겹치는 기록은 별도 백업으로 보관됩니다.</small></main><script type="module" src="src/persistence/upgrade.js"></script></body></html>

  <rect width="1056" height="380" fill="#10151b"/>
  <text x="24" y="31" class="title">SPIREBOUND · 공통 픽셀 규칙을 유지한 분위기 비교</text>
  <text x="24" y="53" class="sub">같은 구조·영웅·적·탄환을 세 팔레트로 비교한 방향 시안. 실제 게임 에셋/화면은 아님.</text>
  <g transform="translate(16 76)" style="--void:#0c1518;--wall:#46524b;--mortar:#1d2928;--floor:#273635;--line:#344743;--edge:#b7c6a4;--stone:#8fa89d;--metal:#9aa8a2;--ember:#d8ad68;--enemy:#49605b;--demon:#2a3c3b;--eye:#ffbd72;--magic:#8fdad8;--hazard:#e7a765"><use href="#scene" xlink:href="#scene"/><text x="0" y="238" class="title">A · 재의 성채</text><text x="0" y="258" class="label">석조·청록빛 / 현재 1~8층과 연결 쉬움</text><rect x="0" y="275" width="64" height="13" fill="#46524b"/><rect x="68" y="275" width="64" height="13" fill="#273635"/><rect x="136" y="275" width="64" height="13" fill="#8fdad8"/><rect x="204" y="275" width="64" height="13" fill="#e7a765"/></g>
  <g transform="translate(368 76)" style="--void:#130d11;--wall:#49383a;--mortar:#211a23;--floor:#282129;--line:#3c3035;--edge:#ac8580;--stone:#825e57;--metal:#95817d;--ember:#fa944d;--enemy:#70434d;--demon:#382831;--eye:#ffd179;--magic:#d793d1;--hazard:#ff8b50"><use href="#scene" xlink:href="#scene"/><text x="0" y="238" class="title">B · 지옥 현무암</text><text x="0" y="258" class="label">검붉은 균열·불씨 / 9·10층 권장</text><rect x="0" y="275" width="64" height="13" fill="#49383a"/><rect x="68" y="275" width="64" height="13" fill="#282129"/><rect x="136" y="275" width="64" height="13" fill="#d793d1"/><rect x="204" y="275" width="64" height="13" fill="#ff8b50"/></g>
  <g transform="translate(720 76)" style="--void:#111420;--wall:#444459;--mortar:#1e2331;--floor:#272b3b;--line:#363e51;--edge:#a8a2c4;--stone:#777b9c;--metal:#b6a7a0;--ember:#dda762;--enemy:#615369;--demon:#342d43;--eye:#f7c079;--magic:#b99de5;--hazard:#df877e"><use href="#scene" xlink:href="#scene"/><text x="0" y="238" class="title">C · 타락한 왕실</text><text x="0" y="258" class="label">남보라·황동 / 8층에서 지옥으로 전이</text><rect x="0" y="275" width="64" height="13" fill="#444459"/><rect x="68" y="275" width="64" height="13" fill="#272b3b"/><rect x="136" y="275" width="64" height="13" fill="#b99de5"/><rect x="204" y="275" width="64" height="13" fill="#df877e"/></g>
</svg>

      <rect x="141" y="122" width="9" height="17" fill="#20242b"/><rect x="154" y="122" width="9" height="17" fill="#20242b"/>
      <rect x="139" y="103" width="25" height="22" fill="#242b33"/><rect x="142" y="105" width="20" height="6" fill="var(--metal)"/>

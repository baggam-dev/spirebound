<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1056" height="380" viewBox="0 0 1056 380">
  <title>Spirebound 아트 방향 비교: 재의 성채, 지옥 현무암, 타락한 왕실</title>
  <style>
    text{font-family:'Malgun Gothic',sans-serif;fill:#e6e1d3}
    .title{font-size:18px;font-weight:700}.sub{font-size:12px;fill:#aaa9a6}.label{font-size:12px}
  </style>
  <defs>
    <pattern id="floorGrid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="var(--line)" stroke-width="1"/></pattern>
    <g id="scene">
      <rect width="320" height="210" fill="var(--void)"/>
      <rect x="12" y="12" width="296" height="186" fill="var(--wall)"/>
      <path d="M12 38H308M12 64H308M12 90H308M12 116H308M12 142H308M12 168H308" stroke="var(--mortar)" stroke-width="3"/>
      <path d="M58 12V38M116 38V64M174 12V38M232 38V64M290 12V38M58 142V168M116 168V198M174 142V168M232 168V198M290 142V168" stroke="var(--mortar)" stroke-width="3"/>

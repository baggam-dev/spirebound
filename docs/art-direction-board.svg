      <rect x="34" y="40" width="252" height="132" fill="url(#floorGrid)"/>
      <path d="M40 45H280M40 168H280" stroke="var(--edge)" stroke-width="3" opacity=".55"/>
      <rect x="50" y="54" width="28" height="8" fill="var(--stone)" opacity=".45"/><rect x="254" y="148" width="20" height="7" fill="var(--stone)" opacity=".4"/>

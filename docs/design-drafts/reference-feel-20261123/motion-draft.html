<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spirebound · 타격 연출 검토 시안</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0e1117;color:#ded8ca;font:16px system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:28px}small{color:#bf9e65;letter-spacing:2px}h1{font-size:26px;margin:12px 0}p{color:#a5abb4;line-height:1.65}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{padding:12px 18px;border:1px solid #65583c;background:#1b2028;color:#eee3cc;cursor:pointer;font:inherit}button[aria-pressed=true]{background:#b89b61;color:#10141b}label{display:inline-flex;gap:8px;align-items:center;padding:10px}canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;background:#151820;border:1px solid #454341}.strip{display:flex;justify-content:space-between;gap:8px;padding:14px 0;color:#c4a773;flex-wrap:wrap}a{color:#d4bd87}</style>
<main><small>SPIREBOUND / MOTION STUDY 01</small><h1>명중은 짧게. 격파는 크게.</h1><p>기존 거인·모르도 외형으로 비교하는 독립 연출 시안입니다. 실제 전투·수치 변경은 없으며, 신규 원화의 최종 품질을 보여주는 자료는 아닙니다.</p>
<nav><button data-mode="hit" aria-pressed="false">일반 명중</button><button data-mode="heavy" aria-pressed="false">강타</button><button data-mode="boss" aria-pressed="true">보스 격파</button><button id="replay">다시 보기</button><label><input type="checkbox" id="reduced">효과 줄이기</label></nav>
<canvas id="stage" width="960" height="540" aria-label="타격과 보스 처치 모션 시안"></canvas><div class="strip"><span id="phase">준비</span><span>기존 자산 · 독립 모션 · 무음</span></div><p>일반 타격에는 전역 정지를 쓰지 않습니다. 강타는 국소 반응과 방향성 파편을 키우고, 보스 격파는 균열 → 붕괴 → 보상 분출 → 흡수로 연결합니다. 시안의 숫자·입자는 보상 지급과 무관합니다.</p><a href="review.md">분석과 개발 계획</a></main>
<script>
const c=stage.getContext('2d'),W=960,H=540;let mode='boss',start=performance.now(),giant=null,king=null;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>1-(1-clamp(t))**3;
function load(file,crop){return new Promise(resolve=>{const image=new Image();image.onload=()=>{const s=document.createElement('canvas');s.width=crop[2];s.height=crop[3];const x=s.getContext('2d');x.drawImage(image,...crop,0,0,s.width,s.height);let d;try{d=x.getImageData(0,0,s.width,s.height).data;}catch{resolve(s);return;}let l=s.width,t=s.height,r=0,b=0;for(let y=0;y<s.height;y++)for(let p=0;p<s.width;p++)if(d[(y*s.width+p)*4+3]>190){l=Math.min(l,p);r=Math.max(r,p);t=Math.min(t,y);b=Math.max(b,y);}const out=document.createElement('canvas');out.width=r-l+1;out.height=b-t+1;out.getContext('2d').drawImage(s,l,t,out.width,out.height,0,0,out.width,out.height);resolve(out);};image.onerror=()=>resolve(null);image.src='../../../assets/images/'+file;});}
Promise.all([load('brute-redesign-v1.png',[0,0,384,341]),load('mordo-presentation-poses-v2.png',[0,0,460,550])]).then(([a,b])=>{giant=a;king=b;start=performance.now();});
function restart(){start=performance.now();}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));restart();});replay.onclick=restart;reduced.onchange=restart;
function box(x,y,w,h,color){c.fillStyle=color;c.fillRect(Math.round(x),Math.round(y),Math.max(1,w),Math.max(1,h));}
function ring(x,y,r,color,alpha=1){c.save();c.globalAlpha=alpha;c.strokeStyle=color;c.lineWidth=2;c.beginPath();for(let i=0;i<=32;i++){const a=i*Math.PI/16,px=Math.round(x+Math.cos(a)*r),py=Math.round(y+Math.sin(a)*r*.45);i?c.lineTo(px,py):c.moveTo(px,py);}c.stroke();c.restore();}
function actor(image,x,y,h,alpha=1,flash=false,tilt=0){if(!image)return;const w=Math.round(image.width*h/image.height);c.save();c.translate(Math.round(x),Math.round(y));c.rotate(tilt);c.globalAlpha=alpha;c.imageSmoothingEnabled=false;c.drawImage(image,-w/2,-h,w,h);if(flash){const s=document.createElement('canvas');s.width=image.width;s.height=image.height;const d=s.getContext('2d');d.drawImage(image,0,0);d.globalCompositeOperation='source-in';d.fillStyle='#fff2d7';d.fillRect(0,0,s.width,s.height);c.drawImage(s,-w/2,-h,w,h);}c.restore();}
function spark(x,y,t,n,power){if(t<0||t>.5)return;const q=t/.5;c.save();c.globalAlpha=(1-q)**2;for(let i=0;i<n;i++){const a=i*2.39996,reach=(12+(i%5)*8)*ease(q)*power,px=x+Math.cos(a)*reach,py=y+Math.sin(a)*reach*.7+q*q*32;c.fillStyle=i%3?'#f2a251':'#fff2d3';const size=Math.max(1,Math.round((1-q)*(i%4===0?5:3)));box(px,py,size*2,size,c.fillStyle);}c.restore();}
function frame(now){const reducedMode=reduced.checked,cycle=mode==='boss'?4:2.1,raw=(now-start)/1000,t=raw%cycle,impact=t-.65,boss=mode==='boss',heavy=mode==='heavy',h=boss?150:95,x=610,y=335;
 c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,W,H);c.save();let shake=0;if(!reducedMode&&impact>0&&impact<.18&&(boss||heavy))shake=(1-impact/.18)*(boss?5:2.5);c.translate(Math.round(Math.sin(t*133)*shake),Math.round(Math.cos(t*101)*shake*.65));
 box(0,0,W,H,'#171b23');for(let row=0;row<10;row++)for(let col=0;col<18;col++){const xx=col*60-row%2*30,yy=row*54;box(xx,yy,58,52,(row+col)%3?'#20252c':'#252a31');box(xx+4,yy+48,48,2,'#141820');}
 box(35,50,890,24,'#383c41');box(35,74,890,8,'#10151b');for(const px of [110,850]){box(px,85,22,330,'#31363e');box(px-8,102,38,12,'#54514b');box(px-6,400,34,10,'#54514b');box(px+6,140,8,20,'#be7d42');box(px+8,140,4,11,'#f1cc86');}box(434,48,92,52,'#726651');box(442,54,76,46,'#182127');box(444,56,4,42,'#b19b68');box(510,56,4,42,'#b19b68');
 ring(x,y+3,boss?72:45,'#0d1119');if(boss&&impact>0&&impact<.8)ring(x,y,30+ease(impact/.8)*240,'#d9b273',(1-impact/.8)*.7);
 const alive=!boss||impact<.75,fade=boss?1-clamp((impact-.25)/.5):1,tilt=boss&&impact>.1?clamp(impact/.75)*.16:0;
 if(alive)actor(boss?king:giant,x+(!boss&&impact>0&&impact<.15?Math.round(Math.sin(impact*30)*4):0),y,h,fade,!reducedMode&&impact>=0&&impact<(heavy?.065:.045),tilt);
 if(t<.65){const q=clamp((t-.35)/.3);box(245+q*340,280,28,3,'#d9b87a');box(245+q*340,280,6,3,'#fff1cc');}
 if(impact>=0){spark(x,y-h*.55,impact,reducedMode?4:boss?36:heavy?20:6,boss?2.5:heavy?1.7:.8);if(!reducedMode&&impact<.08){c.strokeStyle='#ffe7b5';c.lineWidth=boss?5:2;c.beginPath();c.moveTo(x-25,y-h*.55+22);c.lineTo(x+25,y-h*.55-22);c.stroke();}if(!boss&&impact<.6){c.globalAlpha=1-clamp(impact/.6);c.fillStyle=heavy?'#ffd88d':'#dedbd1';c.font=(heavy?'bold 26px':'18px')+' monospace';c.textAlign='center';c.fillText(heavy?'CRITICAL':'HIT',x,y-h-12-ease(impact/.6)*25);c.globalAlpha=1;}}
 if(boss&&impact>.18&&impact<.9){const q=(impact-.18)/.72;c.globalAlpha=1-q;for(let i=0;i<(reducedMode?8:26);i++){const a=i*2.39996,rr=(30+i%5*14)*ease(q);box(x+Math.cos(a)*rr,y-h*.5+Math.sin(a)*rr+q*q*110,3+i%4,5+i%6,i%3?'#8b7891':'#ddad69');}c.globalAlpha=1;}
 if(boss&&impact>.75&&impact<2.5){const q=impact-.75,absorb=clamp((q-.6)/.65);for(let i=0;i<(reducedMode?10:30);i++){const a=i*2.39996,rr=20+i%7*11,px=x+Math.cos(a)*rr*ease(q/.3),py=y+Math.sin(a)*rr*.4-Math.sin(clamp(q/.65)*Math.PI)*50;const dx=px+(270-px)*ease(absorb),dy=py+(335-py)*ease(absorb);c.globalAlpha=1-clamp((q-1.1)/.2);box(dx,dy,i%4===0?5:3,i%4===0?5:3,i%3?'#e6bc6d':'#b9e4db');if(i%7===0&&!reducedMode&&absorb===0){c.globalAlpha=.2;box(dx,dy-55,3,55,'#edcd80');}}c.globalAlpha=1;}
 c.restore();box(30,24,220,5,'#55504a');box(30,24,boss?220*(1-clamp(impact/.05)):220,5,'#b47c60');c.textAlign='left';c.font='14px monospace';c.fillStyle='#d4bf98';c.fillText(boss?'MORDO / CLEAR STUDY':'IMPACT / STUDY',30,48);
 if(boss&&impact>.75&&impact<2){const a=clamp((impact-.75)/.15)*clamp((2-impact)/.25);c.globalAlpha=a;c.textAlign='center';c.font='bold 30px system-ui';c.fillStyle='#efdbad';c.fillText('봉인이 무너졌다',480,137);c.font='14px system-ui';c.fillStyle='#b6b5b2';c.fillText('균열 · 붕괴 · 보상 · 흡수',480,166);c.globalAlpha=1;}
 document.getElementById('phase').textContent=impact<0?'01 / 발사와 접근':!boss?'02 / 명중과 짧은 잔향':impact<.18?'02 / 최종 타격':impact<.75?'03 / 몸체 붕괴':impact<1.35?'04 / 보상 분출':impact<2?'05 / 흡수와 마무리':'다시 재생';requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></html>

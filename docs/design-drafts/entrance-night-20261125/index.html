<h1>메인과 같은 야간 톤 · 보행과 멈춤 연결</h1>
<p>어두운 청회색·국소적인 불빛으로 통일했습니다. 뒤 보행 8자세 → 멈춤/장비 정리 4자세 → 정면 보행 8자세를 분리한 검토용 합성입니다. 마지막 문 닫힘은 끝 상태 확인용 컷이며 실제 경첩 모션 구현은 아닙니다.</p>
<button id="toggle">움직임 멈추기</button> <a href="storyboard.png">네 장면 크게 보기</a> · <a href="actor-contact.png">주인공 20자세</a> · <a href="README.md">구성·제약</a>
<p><img id="preview" src="motion-preview.gif" width="1280" height="720" alt="어두운 탑으로 접근하고 문 앞에서 멈춘 뒤 내부로 들어가는 주인공 움직임 시안"></p>
<p>640×360 논리 픽셀·8초/10fps. 실제 게임에는 아직 반영하지 않았습니다.</p>
<script>let still=matchMedia('(prefers-reduced-motion: reduce)').matches;const p=document.querySelector('#preview'),b=document.querySelector('#toggle');function sync(){p.src=still?'storyboard.png':'motion-preview.gif';b.textContent=still?'움직임 재생':'움직임 멈추기';b.setAttribute('aria-pressed',String(still));}b.onclick=()=>{still=!still;sync();};sync();</script>

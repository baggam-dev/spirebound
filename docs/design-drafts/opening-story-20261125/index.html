<h1>돌아오지 않은 이들의 흔적을 따라</h1>
<p>왕국 → 실종 원정대 → 정찰병의 임무 → 탑 도착. 글은 위로 흐르고 배경4컷이 연달아 전환됩니다. 서사28초와 입장 연결 예시2초를 묶었습니다. 음성 나레이션은 없는 글 연출 시안입니다.</p>

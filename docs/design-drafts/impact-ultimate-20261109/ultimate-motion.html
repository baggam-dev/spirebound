  else if(imageReady){const index=ending?3:time<.28?0:age<.12?2:1,sw=image.naturalWidth/2,sh=image.naturalHeight/2,anchors=[350,320,320,320],feet=[520,560,550,515],anchorScale=sw/640,scale=.19;c.save();c.globalAlpha=ending?clamp((2.2-time)/.3):1;const recoil=ending?0:Math.max(0,1-age/.12)*6;c.drawImage(image,(index%2)*sw,Math.floor(index/2)*sh,sw,sh,420-anchors[index]*anchorScale*scale-recoil,340-feet[index]*anchorScale*scale,sw*scale,sh*scale);c.restore();}
  if(!ending){const x=470+age*900;if(x<720){stroke(c,x-28,285,x,285,'#c9b078',after?4:2);wedge(c,x,285,0,after?12:6,after?4:2,'#f5e8cb');}if(after&&age<.06){c.save();c.globalAlpha=1-age/.06;wedge(c,468,285,0,20,5,'#fff0c7');c.restore();}if(after&&age>.23&&age<.45)spark(c,720,285,age-.23,2);}
  if(after&&!imageReady){c.fillStyle=p.text;c.font='34px sans-serif';c.textAlign='center';c.fillText('석궁 원본 로딩 중',420,250);}
 }
 function render(){const p=palette();canvases.forEach((canvas,i)=>{const c=canvas.getContext('2d');c.clearRect(0,0,480,300);c.save();c.scale(.5,.5);c.fillStyle=p.floor;c.fillRect(0,0,960,600);c.strokeStyle=p.grid;c.lineWidth=1;for(let x=0;x<=960;x+=48){c.beginPath();c.moveTo(x,0);c.lineTo(x,600);c.stroke();}for(let y=0;y<=600;y+=48){c.beginPath();c.moveTo(0,y);c.lineTo(960,y);c.stroke();}c.imageSmoothingEnabled=false;if(scene.value==='hit')hit(c,!!i,p);else if(scene.value==='rain')rain(c,!!i,p);else turret(c,!!i,p);c.restore();});clock.textContent=Math.round(time*1000)+' ms';seek.max=Math.round(length()*1000);seek.value=Math.round(time*1000);}
 const remember=()=>{window.openai?.setWidgetState({modelContent:{scene:scene.value,reduced:reduced.checked},privateContent:{speed:speed.value,time}}).catch(()=>{});};
 function stop(){playing=false;play.textContent='재생';cancelAnimationFrame(frameId);}
 function animate(now){if(!playing)return;const dt=Math.min(.05,(now-last)/1000);last=now;time=Math.min(length(),time+dt*Number(speed.value));render();if(time>=length()){stop();return;}frameId=requestAnimationFrame(animate);}
 play.onclick=()=>{if(playing){stop();return;}if(time>=length())time=0;playing=true;last=performance.now();play.textContent='일시정지';remember();frameId=requestAnimationFrame(animate);};
 scene.onchange=()=>{stop();time=.12;status.textContent=label();render();remember();};reduced.onchange=()=>{render();remember();};speed.onchange=remember;seek.oninput=()=>{stop();time=Number(seek.value)/1000;render();};seek.onchange=remember;
 function restore(s){if(!s)return;const m=s.modelContent||{},v=s.privateContent||{};if(['hit','rain','turret'].includes(m.scene)&&!(m.scene==='turret'&&!imageSource))scene.value=m.scene;if(typeof m.reduced==='boolean')reduced.checked=m.reduced;if(['1','0.25'].includes(v.speed))speed.value=v.speed;if(Number.isFinite(v.time))time=clamp(v.time,0,length());status.textContent=label();render();}
 if(!imageSource)root.querySelector('[data-turret-option]').remove();
 reduced.checked=matchMedia('(prefers-reduced-motion: reduce)').matches;restore(window.openai?.widgetState);render();
 window.addEventListener('openai:set_globals',e=>{if(e.detail.globals?.widgetState){stop();restore(e.detail.globals.widgetState);}});
 document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true,attributeFilter:['class','style']});
 })();

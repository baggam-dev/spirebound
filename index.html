<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101619"><title>Spirebound · 탑의 귀환자</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="layout.css"><link rel="stylesheet" href="mobile.css"><link rel="stylesheet" href="pixel-theme.css"></head><body>
<header><a href="./">SPIREBOUND</a><span class="edition">EIGHT FLOORS. ONE WAY HOME. <b>베타 준비 0.31</b></span><button id="route" hidden>귀환 경로</button><button id="warningSound" aria-pressed="true">경고음 켬</button><button id="help">도움말</button><button id="bag">가방 <kbd>I</kbd></button><button id="pause">일시정지 <kbd>ESC</kbd></button></header>

 <div id="collectionHUD"><div id="relicStrip" aria-label="획득한 유물"></div><div id="essenceStrip" aria-label="획득한 정수"></div></div>
 <div id="statReadout" class="hud-stats"></div>
 <div class="hud-bottom"><div class="vitals"><div id="heartStrip" role="img"></div><div id="shieldStatus"></div></div><div class="build-status"><div id="skillStrip" aria-label="획득한 기술"></div><div id="hexStatus"></div></div></div>
 <div id="xpTrack" role="progressbar" aria-label="다음 레벨 경험치" aria-valuemin="0"><div id="xpFill"></div><span id="xpLabel"></span></div>
</div><div id="notice" role="status"></div><div class="touch"><div id="stick"><i></i></div><div class="actions"><button id="potion">물약 <kbd>Q</kbd></button><button id="skill" hidden>화살비 <kbd>F</kbd></button><button id="dodge">점멸 <kbd>SPACE</kbd></button></div></div><button id="interact" hidden>상호작용 E</button><div id="overlay"></div></div>
